x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:15
    container_name: netsentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: netsentinel-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: netsentinel-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Descarrega o modelo na primeira execução e termina.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: netsentinel-ollama-pull
    environment:
      OLLAMA_HOST: ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-llama3}"]
    depends_on:
      ollama:
        condition: service_healthy

  api:
    <<: *app
    container_name: netsentinel-api
    # Sem porta no host: de fora, a API só é acessível pelo Caddy em https://localhost:8443/api.
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/netsentinel
      # O Caddy retira o prefixo /api; com o root_path, o Swagger pede /api/openapi.json.
      UVICORN_ROOT_PATH: /api
      # Aceita o X-Forwarded-For do Caddy (a porta 8000 só existe na rede interna do Compose).
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      # Bases DB-IP Lite (scripts/update-geoip.ps1); fora do Git e da imagem, só de leitura.
      - ./data/geoip:/app/data/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen('http://127.0.0.1:8000/', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10

  # Sem env_file: o dashboard não recebe a API_KEY nem as credenciais da base de dados.
  # Cada pessoa entra com o seu utilizador, e é a API que decide o que cada perfil pode fazer.
  dashboard:
    build: .
    restart: unless-stopped
    container_name: netsentinel-dashboard
    command:
      - streamlit
      - run
      - dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    # Sem porta no host: o navegador entra por https://localhost:8443 (Caddy).
    expose:
      - "8501"
    environment:
      # Chamadas feitas no servidor do Streamlit, pela rede interna; o navegador nunca fala com a API.
      API_URL: http://api:8000
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
    depends_on:
      api:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: netsentinel-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      # Envia o console.log dos nós Code para `docker logs netsentinel-n8n`.
      CODE_ENABLE_STDOUT: "true"
    volumes:
      - n8n_data:/home/node/.n8n

  # Proxy reverso com HTTPS local (certificado da CA interna do Caddy).
  caddy:
    image: caddy:2.10.2-alpine
    container_name: netsentinel-caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Guarda a CA local: sem este volume, cada recriação geraria uma CA nova.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
  n8n_data:
  caddy_data:
  caddy_config:
