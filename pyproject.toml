[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", "app/venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008"]  # Depends() nos argumentos é o padrão do FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
